<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cognitive Alarm</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at top, #1e293b 0%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="glass-panel register-card">
        <a href="/" style="text-decoration: none; color: var(--text-secondary); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px;">← Back to Home</a>
        
        <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px;">Get Started</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">Create your Cognitive Alarm account.</p>

        <form action="/api/auth/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required class="form-input" placeholder="Sarah Connor">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required class="form-input" placeholder="sconnor">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required class="form-input" placeholder="sarah@sky.net">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required class="form-input" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-input" style="background-color: var(--bg-secondary); color: var(--text-primary);">
                    <option value="user">Standard User</option>
                    <option value="coach">Wellness Coach</option>
                    <option value="administrator">System Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign Up</button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
        </div>
    </div>
</body>
</html>
