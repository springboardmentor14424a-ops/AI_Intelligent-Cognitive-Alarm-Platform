<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - WakeWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <div class="db-wrapper">
        <aside class="db-sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>WakeWise AI</span>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="dashboard-user.html#dashboard"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li class="sidebar-menu-item"><a href="dashboard-user.html#alarms"><i class="fas fa-clock"></i> <span>My Alarms</span></a></li>
                <li class="sidebar-menu-item"><a href="dashboard-user.html#challenges"><i class="fas fa-puzzle-piece"></i> <span>Challenges</span></a></li>
                <li class="sidebar-menu-item active"><a href="dashboard-user.html#habits"><i class="fas fa-tasks"></i> <span>Habit Tracker</span></a></li>
                <li class="sidebar-menu-item"><a href="dashboard-user.html#analytics"><i class="fas fa-chart-line"></i> <span>Analytics</span></a></li>
                <li class="sidebar-menu-item"><a href="dashboard-user.html#notifications"><i class="fas fa-bell"></i> <span>Notifications</span></a></li>
                <li class="sidebar-menu-item"><a href="dashboard-user.html#profile"><i class="fas fa-user-cog"></i> <span>Profile</span></a></li>
            </ul>
        </aside>
        <main class="db-main" style="padding:24px;">
            <div class="card" style="margin-bottom:20px;">
                <h2 style="margin-top:0;">Habit Tracker</h2>
                <p style="color:var(--text-secondary);">Track your daily rituals, mark completion, and keep your wake routine consistent.</p>
            </div>
            <div class="card">
                <div id="habits-list-container"></div>
            </div>
        </main>
    </div>

    <div id="challenge-modal" class="modal-overlay">
        <div class="modal-container" style="max-width:440px;">
            <div class="modal-header">
                <h3><i class="fas fa-brain grad-text"></i> Prefrontal Awakening Test</h3>
                <button class="modal-close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size:0.85rem; color:var(--text-secondary); text-align:center;">Solve the challenge to silence the alarm.</p>
                <div class="challenge-math-question" id="challenge-question">8 x 7 + 12</div>
                <div class="form-group">
                    <input type="number" id="challenge-answer" class="form-control" placeholder="Enter answer here..." required>
                </div>
                <div class="challenge-feedback" id="challenge-feedback"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="submit-challenge-btn" style="width:100%;">Verify Formula</button>
            </div>
        </div>
    </div>

    <audio id="alarm-audio" loop preload="auto">
        <source src="../assets/sounds/radar.mp3" type="audio/mpeg">
        <source src="/assets/sounds/radar.mp3" type="audio/mpeg">
    </audio>

    <script src="../js/utils.js?v=1.0.6"></script>
    <script src="../js/auth.js?v=1.0.6"></script>
    <script>protectPage('user');</script>
    <script src="../js/user.js?v=1.0.6"></script>
</body>
</html>
