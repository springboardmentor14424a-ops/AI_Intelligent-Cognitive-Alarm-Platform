<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Cognitive Alarm</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at top, #1e293b 0%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .reset-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="glass-panel reset-card">
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px;">Set New Password</h2>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 24px;">Provide your new credentials below to restore system access.</p>
        
        <form action="/api/auth/reset-password" method="POST">
            <!-- Reset Token passed from query parameters -->
            <input type="hidden" name="token" id="token-input" value="{{ token }}">
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required class="form-input" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Reset Credentials</button>
        </form>
    </div>
</body>
</html>
