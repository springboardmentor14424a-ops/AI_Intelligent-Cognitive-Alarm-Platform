<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Cognitive Alarm</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at top, #1e293b 0%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-card">
        <a href="/" style="text-decoration: none; color: var(--text-secondary); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px;">← Back to Home</a>
        
        <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 30px;">Sign in to manage your wake routines and habits.</p>

        <form action="/api/auth/login" method="POST">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" id="username-field" required class="form-input" placeholder="Enter username or email">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Password</label>
                    <button type="button" onclick="showForgotPassword()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; font-family: inherit;">Forgot Password?</button>
                </div>
                <input type="password" name="password" id="password-field" required class="form-input" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign In</button>
        </form>

        <div style="display: flex; align-items: center; margin: 24px 0; color: var(--text-muted);">
            <hr style="flex-grow: 1; border: none; border-bottom: 1px solid var(--border-card);">
            <span style="padding: 0 12px; font-size: 12px;">OR</span>
            <hr style="flex-grow: 1; border: none; border-bottom: 1px solid var(--border-card);">
        </div>

        <button type="button" onclick="googleLoginPrompt()" class="btn btn-secondary" style="width: 100%; display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 24px;">
            Continue with Google (OAuth Select)
        </button>

        <div>
            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 10px; font-weight: bold; letter-spacing: 0.5px;">Quick Demo Logins</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <button type="button" onclick="quickLogin('admin', 'admin123')" class="btn btn-secondary" style="padding: 8px; font-size: 12px;">🛡 Admin</button>
                <button type="button" onclick="quickLogin('coach', 'coach123')" class="btn btn-secondary" style="padding: 8px; font-size: 12px;">👥 Coach</button>
                <button type="button" onclick="quickLogin('user', 'user123')" class="btn btn-secondary" style="padding: 8px; font-size: 12px;">👤 User</button>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Forgot Password</h3>
                <button type="button" onclick="closeForgotPassword()" class="modal-close">×</button>
            </div>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">Enter your registered email address and we'll generate a password reset link (Dev Mode).</p>
            <form onsubmit="submitForgotPassword(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="forgot-email" required class="form-input" placeholder="sarah@cognitivealarm.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Get Reset Link</button>
            </form>
            <div id="forgot-result" style="margin-top: 20px; display: none;">
                <span style="font-size: 12px; color: var(--warning); font-weight: bold; display: block; margin-bottom: 4px;">Developer Password Reset Link:</span>
                <a id="forgot-link" href="" style="color: var(--primary); font-size: 12px; word-break: break-all;"></a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        function googleLoginPrompt() {
            const email = prompt("Enter your Google Email Address to authenticate:", "user@cognitivealarm.com");
            if (email && email.trim() !== "") {
                window.location.href = `/api/auth/google-login-bypass?email=${encodeURIComponent(email.trim())}`;
            }
        }
        function quickLogin(username, password) {
            document.getElementById('username-field').value = username;
            document.getElementById('password-field').value = password;
            document.querySelector('form').submit();
        }
        function showForgotPassword() {
            document.getElementById('forgot-modal').classList.add('active');
        }
        function closeForgotPassword() {
            document.getElementById('forgot-modal').classList.remove('active');
            document.getElementById('forgot-result').style.display = 'none';
        }
        async function submitForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const formData = new URLSearchParams();
            formData.append('email', email);

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await res.json();
                if (data.dev_reset_link) {
                    const resultDiv = document.getElementById('forgot-result');
                    const linkA = document.getElementById('forgot-link');
                    linkA.href = data.dev_reset_link;
                    linkA.innerText = window.location.origin + data.dev_reset_link;
                    resultDiv.style.display = 'block';
                    showToast("Password reset link generated!");
                } else {
                    showToast(data.message);
                }
            } catch (err) {
                showToast("Request failed", "danger");
            }
        }
    </script>
</body>
</html>
