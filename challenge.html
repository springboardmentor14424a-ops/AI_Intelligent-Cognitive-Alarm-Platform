<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Alarm — Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d2a63;
      --card:      #ffffff;
      --primary:   #1E88E5;
      --success:   #22C55E;
      --danger:    #EF4444;
      --warning:   #F59E0B;
      --ink:       #1F2937;
      --muted:     #6B7280;
      --border:    #E5E7EB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0a1f44 0%, #0d2a63 50%, #1552c9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Time display ── */
    .alarm-time {
      font-family: 'Poppins', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      color: #fff;
      text-align: center;
      line-height: 1;
      margin-bottom: 6px;
    }

    .alarm-date {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.65);
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── Type + difficulty badges ── */
    .badge-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .badge-type { background: rgba(255,255,255,0.15); color: #fff; }
    .badge-diff { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.85); }

    /* ── Challenge card ── */
    .challenge-card {
      background: var(--card);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      padding: 28px 28px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }

    /* ── Progress bar (3 segments) ── */
    .progress-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .progress-seg {
      height: 5px;
      flex: 1;
      border-radius: 3px;
      background: var(--border);
      transition: background 0.3s;
    }

    .progress-seg.done    { background: var(--success); }
    .progress-seg.active  { background: var(--primary);  }

    /* ── Step label ── */
    .step-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── Question ── */
    .question-text {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 10px;
      padding: 0 8px;
    }

    /* ── Timer ── */
    .timer-row {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--warning);
      margin-bottom: 20px;
    }

    .timer-row.danger { color: var(--danger); }
    .timer-row.ok     { color: var(--muted); }

    /* ── Options grid ── */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 18px 12px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--card);
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
    }

    .opt-btn:hover    { border-color: var(--primary); background: #EDF6FF; color: var(--primary); }
    .opt-btn.selected { border-color: var(--primary); background: #EDF6FF; color: var(--primary); }
    .opt-btn.correct  { border-color: var(--success); background: #dcfce7; color: #166534; }
    .opt-btn.wrong    { border-color: var(--danger);  background: #fee2e2; color: #991b1b; }

    /* ── Text input (for memory/word/pattern) ── */
    .answer-input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #f8fafc;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      text-align: center;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .answer-input:focus { border-color: var(--primary); background: #fff; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-bottom: 8px;
    }

    .btn-submit:hover    { background: #1565C0; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ── Footer text ── */
    .footer-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Result feedback ── */
    .result-feedback {
      display: none;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .result-feedback.success { background: #dcfce7; color: #166534; }
    .result-feedback.fail    { background: #fee2e2; color: #991b1b; }

    /* ── Dismissed screen ── */
    .dismissed-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 0;
    }

    .dismissed-screen .check {
      font-size: 3.5rem;
    }

    .dismissed-screen h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--success);
    }

    .dismissed-screen p {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .btn-dashboard {
      margin-top: 8px;
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Loading */
    .loading-text {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Time -->
  <div class="alarm-time" id="alarmTimeDisplay">06:30 AM</div>
  <div class="alarm-date" id="alarmDateDisplay">Monday, August 11</div>

  <!-- Badges -->
  <div class="badge-row">
    <span class="badge badge-type" id="badgeType">
      <span>⬛</span> <span id="typeLabel">Math Problems</span>
    </span>
    <span class="badge badge-diff" id="badgeDiff">Medium</span>
  </div>

  <!-- Card -->
  <div class="challenge-card">

    <!-- Progress bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-seg" id="seg0"></div>
      <div class="progress-seg" id="seg1"></div>
      <div class="progress-seg" id="seg2"></div>
    </div>

    <!-- Step label -->
    <div class="step-label" id="stepLabel">STEP 1 OF 3 · CONSECUTIVE CORRECT REQUIRED</div>

    <!-- Dynamic content -->
    <div id="challengeContent">
      <div class="loading-text">Loading your challenge...</div>
    </div>

    <!-- Dismissed screen (hidden until 3 correct) -->
    <div class="dismissed-screen" id="dismissedScreen">
      <div class="check">✅</div>
      <h2>Alarm Dismissed!</h2>
      <p>Great job! You solved 3 challenges in a row.<br>Have a productive day.</p>
      <button class="btn-dashboard" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
    </div>

  </div>

  <!-- Footer -->
  <p style="color:rgba(255,255,255,0.45);font-size:0.78rem;margin-top:18px;">
    Solve 3 in a row correctly to dismiss the alarm
  </p>

<script>
const API = 'http://localhost:8000';

// ── URL params ────────────────────────────────────────────────
const params      = new URLSearchParams(window.location.search);
const challengeType = params.get('type') || 'math';
const difficulty  = params.get('difficulty') || 'medium';
const alarmTime   = params.get('time') || '';
const alarmLabel  = params.get('label') || 'Morning Alarm';

// ── Set alarm time & date ─────────────────────────────────────
if (alarmTime) document.getElementById('alarmTimeDisplay').textContent = alarmTime;
const now = new Date();
document.getElementById('alarmDateDisplay').textContent =
  now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

// ── Badge labels ──────────────────────────────────────────────
const typeLabels = {
  math: 'Math Problems', logic: 'Logic Puzzles', memory: 'Memory Challenges',
  word: 'Word Games', pattern: 'Pattern Recognition', riddle: 'Riddles', quiz: 'Quick Quizzes'
};
const typeIcons = {
  math: '🔢', logic: '🧩', memory: '🧠', word: '📝', pattern: '🔷', riddle: '🤔', quiz: '❓'
};

document.getElementById('typeLabel').textContent = typeLabels[challengeType] || challengeType;
document.querySelector('#badgeType span').textContent = typeIcons[challengeType] || '⬛';
document.getElementById('badgeDiff').textContent =
  difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

// ── State ─────────────────────────────────────────────────────
let correctStreak = 0;   // need 3
let currentChallenge = null;
let selectedOption   = null;
let timerInterval    = null;
let timeLeft         = 45;
let totalTime        = 45;
let startTime        = Date.now();

// ── Progress bar ──────────────────────────────────────────────
function updateProgress() {
  for (let i = 0; i < 3; i++) {
    const seg = document.getElementById(`seg${i}`);
    seg.className = 'progress-seg';
    if (i < correctStreak)     seg.classList.add('done');
    else if (i === correctStreak) seg.classList.add('active');
  }
  document.getElementById('stepLabel').textContent =
    `STEP ${correctStreak + 1} OF 3 · CONSECUTIVE CORRECT REQUIRED`;
}

// ── Load challenge ────────────────────────────────────────────
async function loadChallenge() {
  selectedOption = null;
  document.getElementById('challengeContent').innerHTML =
    '<div class="loading-text">Loading challenge...</div>';
  updateProgress();

  try {
    const res  = await fetch(`${API}/challenges/generate?type=${challengeType}&difficulty=${difficulty}`);
    currentChallenge = await res.json();
    renderChallenge(currentChallenge);
    startTimer(currentChallenge.time_limit || 45);
  } catch {
    document.getElementById('challengeContent').innerHTML =
      '<div class="loading-text">⚠️ Cannot connect to server.</div>';
  }
}

// ── Render challenge ──────────────────────────────────────────
function renderChallenge(c) {
  let answerHtml = '';
  if (c.input_type === 'choice' && c.options?.length) {
    answerHtml = `<div class="options-grid" id="optionsGrid">
      ${c.options.map(o =>
        `<button class="opt-btn" onclick="selectOption(this,'${o.replace(/'/g,"\\'")}')">
          ${o}
        </button>`
      ).join('')}
    </div>`;
  } else {
    answerHtml = `<input type="text" class="answer-input" id="answerInput"
      placeholder="Type your answer..." autocomplete="off"
      onkeydown="if(event.key==='Enter')submitAnswer()">`;
  }

  document.getElementById('challengeContent').innerHTML = `
    <div class="question-text" id="questionText">${c.question}</div>
    <div class="timer-row ok" id="timerRow">⏳ ${c.time_limit || 45}s remaining</div>
    ${answerHtml}
    <div class="result-feedback" id="resultFeedback"></div>
    <button class="btn-submit" id="submitBtn" onclick="submitAnswer()">Submit</button>
    <div class="footer-text">Solve 3 in a row correctly to dismiss the alarm</div>
  `;

  startTime = Date.now();
}

// ── Option select ─────────────────────────────────────────────
function selectOption(btn, val) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = val;
}

// ── Submit ────────────────────────────────────────────────────
async function submitAnswer() {
  if (!currentChallenge) return;
  const submitBtn = document.getElementById('submitBtn');
  const feedback  = document.getElementById('resultFeedback');
  submitBtn.disabled = true;

  let userAnswer = '';
  if (currentChallenge.input_type === 'choice') {
    userAnswer = selectedOption || '';
    if (!userAnswer) { submitBtn.disabled = false; return; }
  } else {
    const inp = document.getElementById('answerInput');
    userAnswer = inp?.value.trim() || '';
    if (!userAnswer) { submitBtn.disabled = false; return; }
  }

  stopTimer();
  const timeTaken = (Date.now() - startTime) / 1000;

  try {
    const res  = await fetch(`${API}/challenges/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        challenge_id:       currentChallenge.challenge_id,
        answer_key:         currentChallenge.answer_key,
        user_answer:        userAnswer,
        time_taken_seconds: timeTaken
      })
    });
    const data = await res.json();

    // Mark options
    document.querySelectorAll('.opt-btn').forEach(b => {
      const t = b.textContent.trim();
      if (t === currentChallenge.answer_key) b.classList.add('correct');
      else if (t === userAnswer)             b.classList.add('wrong');
    });

    feedback.style.display = 'block';

    if (data.success) {
      feedback.className = 'result-feedback success';
      feedback.textContent = '✅ Correct! ' + data.message;
      correctStreak++;
      updateProgress();

      if (correctStreak >= 3) {
        // Alarm dismissed
        setTimeout(() => {
          document.getElementById('challengeContent').style.display = 'none';
          document.getElementById('dismissedScreen').style.display  = 'flex';
        }, 900);
      } else {
        setTimeout(loadChallenge, 1200);
      }
    } else {
      feedback.className = 'result-feedback fail';
      feedback.textContent = '❌ Wrong! ' + data.message;
      correctStreak = 0;   // reset streak
      updateProgress();
      setTimeout(loadChallenge, 1800);
    }

  } catch {
    feedback.style.display = 'block';
    feedback.className = 'result-feedback fail';
    feedback.textContent = 'Cannot connect to server.';
    submitBtn.disabled = false;
  }
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer(seconds) {
  stopTimer();
  timeLeft  = seconds;
  totalTime = seconds;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { stopTimer(); timeExpired(); }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerUI() {
  const row = document.getElementById('timerRow');
  if (!row) return;
  row.textContent = `⏳ ${timeLeft}s remaining`;
  row.className   = `timer-row ${timeLeft <= 10 ? 'danger' : timeLeft <= 20 ? '' : 'ok'}`;
}

function timeExpired() {
  const fb = document.getElementById('resultFeedback');
  if (fb) {
    fb.style.display = 'block';
    fb.className = 'result-feedback fail';
    fb.textContent = `⏰ Time\'s up! Answer was: ${currentChallenge?.answer_key || ''}`;
  }
  const sb = document.getElementById('submitBtn');
  if (sb) sb.disabled = true;
  correctStreak = 0;
  updateProgress();
  setTimeout(loadChallenge, 2000);
}

// ── Init ──────────────────────────────────────────────────────
updateProgress();
loadChallenge();
</script>
</body>
</html>
