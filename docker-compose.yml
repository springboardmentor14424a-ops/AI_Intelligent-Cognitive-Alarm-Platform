version: '3.8'

services:
  # ------------------------------------
  # 1. PostgreSQL Database Service
  # ------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cognitive_alarm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cognitive_alarm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognitive_alarm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------
  # 2. Backend Express API Service
  # ------------------------------------
  backend:
    build:
      context: .
      target: server-runner
    container_name: cognitive_alarm_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cognitive_alarm_db
      JWT_SECRET: cognitive_alarm_production_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------
  # 3. Frontend Web Application Service
  # ------------------------------------
  frontend:
    build:
      context: .
      target: client-builder
    container_name: cognitive_alarm_frontend
    restart: always
    ports:
      - "3000:3000"
    command: sh -c "npx vite preview --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  postgres_data:
