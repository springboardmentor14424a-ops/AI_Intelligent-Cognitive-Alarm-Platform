services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brainos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@database:5432/brainos
      JWT_SECRET: change-this-before-production
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [database]
volumes:
  postgres_data:
