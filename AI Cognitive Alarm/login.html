
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Cognitive Alarm</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="login-page">

<div class="login-container">

    <!-- Left Side -->

    <div class="login-left">

        <div class="login-content">

            <h1>Welcome Back!</h1>

            <p>

                Login to access your AI Cognitive Alarm Dashboard
                and continue your healthy morning journey.

            </p>

            <i class="fa-solid fa-brain login-icon"></i>

        </div>

    </div>

    <!-- Right Side -->

    <div class="login-right">

        <div class="login-box">

            <h2>Login</h2>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email">

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password">

            </div>

            <div class="input-group">

                <label>Select Role</label>

                <select id="role">

                    <option value="user">
                        User
                    </option>

                    <option value="coach">
                        Coach
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>

            <button onclick="loginUser()">

                Login

            </button>

            <p class="back-home">

                <a href="index.html">

                    ← Back to Home

                </a>

            </p>

        </div>

    </div>

</div>

<script>

function loginUser(){

let role = document.getElementById("role").value;

if(role=="user"){

window.location="user.html";

}

else if(role=="coach"){

window.location="coach.html";

}

else{

window.location="admin.html";

}

}

</script>

</body>

</html>
