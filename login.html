<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WakeWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark" class="login-body">
    <!-- Loader Mask -->
    <div id="loader-mask" class="loader-mask">
        <div class="spinner"></div>
        <p>INITIALIZING CLIENT PORTAL...</p>
    </div>

    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>WakeWise <span class="grad-text">AI</span></span>
            </div>
            <p id="portal-desc">Access your cognitive workspace</p>
        </div>

        <!-- SEPARATE ROLE LOGIN TABS -->
        <div class="role-tabs-container">
            <button type="button" class="role-tab-btn active" data-role="user">
                <i class="fas fa-user-graduate"></i> User / Student
            </button>
            <button type="button" class="role-tab-btn" data-role="coach">
                <i class="fas fa-user-md"></i> Wellness Coach
            </button>
            <button type="button" class="role-tab-btn" data-role="admin">
                <i class="fas fa-shield-alt"></i> Administrator
            </button>
        </div>

        <!-- LOGIN FORM CONTAINER -->
        <div id="login-container" class="glass-card primary-hover">
            <h2 class="grad-text" id="login-title" style="text-align: center; margin-bottom: 20px; font-size: 1.5rem;">User / Student Sign In</h2>

            <form id="login-form" autocomplete="off">
                <!-- Hidden role input driven by role tabs -->
                <input type="hidden" id="login-role" value="user">

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="e.g., user@alarm.com" autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="new-password" value="" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Access Portal <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <div class="form-toggle-prompt" id="register-prompt-wrapper">
                Don't have an account? <a href="#" id="to-register-btn">Create one now</a>
            </div>
        </div>

        <!-- REGISTRATION FORM CONTAINER (HIDDEN BY DEFAULT) -->
        <div id="register-container" class="glass-card secondary-hover" style="display: none;">
            <h2 class="grad-text-secondary" style="text-align: center; margin-bottom: 20px; font-size: 1.5rem;">Register Account</h2>
            <form id="register-form" autocomplete="off">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g., Alex Mercer" autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g., user@alarm.com" autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" autocomplete="new-password" value="" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account <i class="fas fa-user-plus"></i></button>
            </form>
            <div class="form-toggle-prompt">
                Already registered? <a href="#" id="to-login-btn">Sign in here</a>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Back to Landing Page</a>
        </div>
    </div>

    <!-- Script Sources -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            
            const loginContainer = document.getElementById('login-container');
            const registerContainer = document.getElementById('register-container');
            
            const toRegisterBtn = document.getElementById('to-register-btn');
            const toLoginBtn = document.getElementById('to-login-btn');
            
            const roleHiddenInput = document.getElementById('login-role');
            
            const roleTabs = document.querySelectorAll('.role-tab-btn');
            const loginTitle = document.getElementById('login-title');
            const registerPromptWrapper = document.getElementById('register-prompt-wrapper');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');

            const regNameInput = document.getElementById('reg-name');
            const regEmailInput = document.getElementById('reg-email');
            const regPasswordInput = document.getElementById('reg-password');

            // Force forms reset on initialization
            loginForm.reset();
            registerForm.reset();
            emailInput.value = '';
            passwordInput.value = '';
            regNameInput.value = '';
            regEmailInput.value = '';
            regPasswordInput.value = '';

            // 1. Role Login Tabs Switching Handler
            function setActiveRoleTab(role) {
                roleTabs.forEach(tab => {
                    if (tab.dataset.role === role) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });

                roleHiddenInput.value = role;
                
                // Clear input fields so nothing is prefilled when changing tabs
                emailInput.value = '';
                passwordInput.value = '';

                // Adjust title and placeholder hints based on selected role
                if (role === 'user') {
                    loginTitle.textContent = 'User / Student Sign In';
                    emailInput.placeholder = 'e.g., user@alarm.com';
                    registerPromptWrapper.style.display = 'block';
                } else if (role === 'coach') {
                    loginTitle.textContent = 'Wellness Coach Sign In';
                    emailInput.placeholder = 'e.g., coach@alarm.com';
                    registerPromptWrapper.style.display = 'block';
                } else if (role === 'admin') {
                    loginTitle.textContent = 'Administrator Portal Sign In';
                    emailInput.placeholder = 'e.g., admin@alarm.com';
                    registerPromptWrapper.style.display = 'none'; // Hide self-registration prompt for Admin
                }
            }

            roleTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selectedRole = tab.dataset.role;
                    setActiveRoleTab(selectedRole);

                    // Ensure login view is visible when switching tabs
                    registerContainer.style.display = 'none';
                    loginContainer.style.display = 'block';
                    document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
                });
            });

            // 2. Toggle Forms Handler
            toRegisterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.reset();
                regNameInput.value = '';
                regEmailInput.value = '';
                regPasswordInput.value = '';

                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Join the cognitive wellness network';
            });

            toLoginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.reset();
                emailInput.value = '';
                passwordInput.value = '';

                registerContainer.style.display = 'none';
                loginContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
            });

            // 3. Parse Query Params to Pre-select Role or Mode
            const urlParams = new URLSearchParams(window.location.search);
            const preSelectedRole = urlParams.get('role');
            const mode = urlParams.get('mode');

            if (preSelectedRole && ['user', 'coach', 'admin'].includes(preSelectedRole)) {
                setActiveRoleTab(preSelectedRole);
            } else {
                setActiveRoleTab('user');
            }

            if (mode === 'register') {
                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Join the cognitive wellness network';
            }

            // 4. Form Submissions powered strictly by PostgreSQL & FastAPI Backend API
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const pass = passwordInput.value.trim();

                const result = await attemptLoginAsync(email, pass);

                if (result.success) {
                    Toast.show('Welcome Back', result.message, 'success');
                    
                    const loader = document.getElementById('loader-mask');
                    if (loader) {
                        loader.classList.remove('hide');
                        loader.querySelector('p').textContent = 'ESTABLISHING DASHBOARD SESSION...';
                    }

                    const targetRole = result.user ? result.user.role.toLowerCase() : 'user';
                    setTimeout(() => {
                        if (targetRole === 'coach') {
                            window.location.href = 'dashboard-coach.html';
                        } else if (targetRole === 'admin') {
                            window.location.href = 'dashboard-admin.html';
                        } else {
                            window.location.href = 'dashboard-user.html';
                        }
                    }, 1000);
                } else {
                    Toast.show('Access Denied', result.message, 'danger');
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = regNameInput.value.trim();
                const email = regEmailInput.value.trim();
                const pass = regPasswordInput.value.trim();
                const role = roleHiddenInput.value || 'USER';

                const result = await registerUserAsync(name, email, pass, role);

                if (result.success) {
                    Toast.show('Registered!', result.message, 'success');
                    registerForm.reset();
                    loginForm.reset();
                    emailInput.value = '';
                    passwordInput.value = '';
                    
                    setTimeout(() => {
                        registerContainer.style.display = 'none';
                        loginContainer.style.display = 'block';
                        document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
                    }, 1000);
                } else {
                    Toast.show('Registration Failed', result.message, 'warning');
                }
            });
        });
    </script>
</body>
</html>
