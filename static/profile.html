<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage profile | Cognitive Alarm</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><section class="hero"><p class="eyebrow">INTELLIGENT COGNITIVE ALARM</p><h1>Manage your profile.</h1><p>Keep your wake-up preferences accurate so future alarm and challenge features can be tailored to you.</p></section><section class="card"><div id="message" role="status"></div><h2>Profile preferences</h2><form id="profile-form"><label>Full name<input id="profile_name" required maxlength="100"></label><label>Time zone<input id="profile_timezone" required maxlength="64"></label><div class="two-fields"><label>Preferred wake-up time<input id="wake_time" type="time"></label><label>Sleep duration (hours)<input id="sleep_hours" type="number" min="1" max="16" step="0.5"></label></div><label>Challenge difficulty<select id="difficulty"><option value="">No preference</option><option>Beginner</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option></select></label><button>Save preferences</button></form><a class="back-link" href="/">← Return to account</a></section></main><script src="/static/profile.js"></script></body></html>
