<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | Cognitive Alarm</title><link rel="stylesheet" href="/static/styles.css"></head><body><main><section class="hero"><p class="eyebrow">ADAPTIVE INTELLIGENCE</p><h1>Your progress.</h1><p>Difficulty recommendations are based on your recent challenge performance.</p></section><section class="card"><h2>Difficulty insight</h2><div id="insight">Loading…</div><a class="back-link" href="/">← Return to account</a></section></main><script>const token=localStorage.getItem('access_token');if(!token)location.replace('/');fetch('/adaptive/difficulty',{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).then(d=>document.getElementById('insight').innerHTML=`<p><strong>Recommended difficulty:</strong> ${d.recommended_difficulty}</p><p><strong>Recent attempts:</strong> ${d.recent_attempts}</p><p><strong>Recent accuracy:</strong> ${d.recent_accuracy_percent??'No completed attempts yet'}${d.recent_accuracy_percent!==null?'%':''}</p>`);</script></body></html>
