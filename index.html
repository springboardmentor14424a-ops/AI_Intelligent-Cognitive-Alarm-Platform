<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simmer: a kitchen-vlog styled dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================ -->
<!-- LANDING PAGE                                                   -->
<!-- ============================================================ -->
<div class="landing" id="page-landing">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="landing-topbar">
    <div class="brand"><span class="brand-icon">🍳</span>Simmer</div>
    <div class="clock mono" id="live-clock">--:--:--</div>
  </div>

  <div class="hero">
    <div class="eyebrow">now plating: today's shift</div>
    <h1 class="display">Grab an apron. Pick your station.</h1>
    <p>Simmer plates up a different workspace for every role in the kitchen, so nobody wades through tools they don't need. Choose a station below to step in.</p>
  </div>

  <div class="console-frame">
    <div class="console-frame-inner">
      <div class="console-label">today's lineup</div>
      <div class="role-grid" id="role-grid"><!-- injected by script.js --></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
